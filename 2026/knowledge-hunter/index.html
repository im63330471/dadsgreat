<!-- OVERVIEW
Collection RPG game, move around, encounter knowledge creatures, answer question,
capture, add to inventory and view.
 -->

<!-- FEATURES
- start screen, continue mode or guest mode
- music

- generated map
- creature images & sounds
- maximum of 3 attempts, keep correct prefix of wrong answers
- inventory of caught creatures, view details
-->

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Knowledge Hunter RPG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game">
    <canvas id="map" width="640" height="480"></canvas>
    <div id="ui">
      <div id="inventory">
        <h3>Inventory</h3>
        <div class="invScroll">
          <table id="invTable">
            <tbody></tbody>
          </table>
        </div>
      </div>
      <!-- touch / virtual controls placed inside UI so landscape can show them under inventory -->
      <div id="touchControls" aria-hidden="false">
        <div id="dpad">
          <button id="btnUp" class="dbtn">▲</button>
          <div class="drow">
            <button id="btnLeft" class="dbtn">◀</button>
            <button id="btnDown" class="dbtn">▼</button>
            <button id="btnRight" class="dbtn">▶</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="encounter" class="hidden">
    <div class="modal">
      <h2 id="creatureName"></h2>
      <p id="encPrompt">A wild creature appeared! Type the correct answer to catch it.</p>
      <img id="encImage" src="" alt="creature" style="display:block;max-width:100%;cursor:pointer;margin:8px 0">
      <input id="answerInput" autocomplete="off"/>
      <div id="attempts"></div>
      <div class="buttons">
        <button id="submitAnswer">Submit</button>
        <button id="runAway" class="secondary">Run</button>
      </div>
    </div>
  </div>

  <div id="viewer" class="hidden">
    <div class="modal">
      <h3 id="viewName"></h3>
      <img id="viewImage" src="" alt="view image" style="display:block;max-width:100%;cursor:pointer;margin:8px 0">
      <p><strong>Season:</strong> <span id="viewSeason"></span></p>
      <p><strong>ID:</strong> <span id="viewId"></span></p>
      <p id="viewDesc"></p>
      <div class="buttons"><button id="closeViewer">Close</button></div>
    </div>
  </div>

<script src="game.js"></script>
</body>
</html>

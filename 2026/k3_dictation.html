<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lexi-Monsters: 聽寫大冒險</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&family=Lexend:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --anime-blue: #2563eb;
            --anime-gold: #fbbf24;
            --anime-bg: #0b1121;
        }
        body {
            font-family: 'Lexend', 'Microsoft JhengHei', sans-serif;
            background: var(--anime-bg);
            background-image: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            color: #fff;
            margin: 0;
            overflow: hidden;
            user-select: none;
            height: 100vh;
            width: 100vw;
        }
        .header-font { font-family: 'Fredoka', 'Microsoft JhengHei', sans-serif; font-weight: 700; }
        
        .game-container {
            width: 100%;
            height: 100%;
            max-width: 1000px;
            margin: 0 auto;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .battle-stage {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 20px;
            flex-grow: 1;
            padding: 20px;
            align-items: center;
        }

        .monster-area {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .platform {
            width: 160px;
            height: 30px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            position: absolute;
            bottom: 40px;
            filter: blur(8px);
            z-index: 0;
        }

        .ui-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 12px;
            width: 100%;
        }

        .health-bar {
            height: 10px;
            background: #1e293b;
            border-radius: 99px;
            overflow: hidden;
            border: 1px solid #334155;
        }
        .health-fill {
            height: 100%;
            transition: width 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .emoji-sprite {
            font-size: 110px;
            z-index: 10;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.5));
            transition: filter 0.05s, transform 0.05s;
        }

        /* 超強擊中特效 */
        .hit-effect {
            filter: brightness(5) invert(1) drop-shadow(0 0 50px white) !important;
            transform: scale(1.3) rotate(5deg) !important;
        }

        /* 畫面閃白特效 */
        .flash-white {
            animation: flash-anim 0.2s ease-out;
        }
        @keyframes flash-anim {
            0% { background: white; }
            100% { background: transparent; }
        }

        /* 火花粒子加強版 */
        .sparkle-container {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .spark {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0;
            box-shadow: 0 0 10px white;
        }
        @keyframes spark-anim {
            0% { transform: translate(0,0) scale(1.5); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }

        .fx-electric { filter: drop-shadow(0 0 20px #fbbf24); }
        .fx-fire { filter: drop-shadow(0 0 25px #ff4500); }
        .fx-aqua { filter: drop-shadow(0 0 20px #0ea5e9); }

        .btn-anime {
            background: linear-gradient(180deg, #6366f1 0%, #4338ca 100%);
            box-shadow: 0 3px 0 #312e81;
            transition: all 0.1s;
        }
        .btn-anime:active { transform: translateY(2px); box-shadow: 0 0 0 transparent; }

        .input-box {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(99, 102, 241, 0.4);
            border-radius: 10px;
            height: 44px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }
        
        .shake-heavy { animation: shake-heavy-anim 0.3s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake-heavy-anim {
            10%, 90% { transform: translate3d(-2px, 0, 0) scale(1.1); }
            20%, 80% { transform: translate3d(4px, 0, 0) scale(1.2); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0) scale(1.2); }
            40%, 60% { transform: translate3d(8px, 0, 0) scale(1.2); }
        }

        .controls-row {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .map-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 10px;
        }

        #flash-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>

<div id="flash-overlay"></div>

<div class="game-container" id="app">
    <!-- 開始畫面 -->
    <div id="screen-intro" class="flex flex-col items-center justify-center flex-grow space-y-6">
        <h1 class="text-6xl header-font text-white drop-shadow-[0_6px_0_#4338ca]">LEXI QUEST</h1>
        <button onclick="game.start()" class="btn-anime px-12 py-4 rounded-2xl text-xl font-bold text-white uppercase tracking-wider">開始冒險</button>
    </div>

    <!-- 地圖畫面 -->
    <div id="screen-map" class="hidden flex-grow flex flex-col p-4">
        <div class="flex justify-between items-center mb-3 ui-panel py-2 px-6">
            <h2 class="text-lg header-font text-blue-300 tracking-tight">世界地圖</h2>
            <div class="text-yellow-400 font-bold text-sm">⭐ <span id="win-count">0</span> / 3</div>
        </div>
        <div class="map-grid flex-grow" id="map-grid"></div>
    </div>

    <!-- 戰鬥畫面 -->
    <div id="screen-battle" class="hidden flex flex-col h-full overflow-hidden">
        <div class="flex justify-between items-center px-4 py-2 bg-black/20">
            <button onclick="game.goToMap()" class="text-[10px] font-bold bg-slate-800 px-3 py-1 rounded-lg border border-slate-600">⬅ 撤退</button>
            <div class="header-font text-yellow-400 text-xs" id="battle-level">STAGE 1</div>
        </div>

        <div class="battle-stage">
            <!-- 左側：魔物區 -->
            <div class="monster-area">
                <div class="relative flex-grow flex items-center justify-center w-full min-h-[200px]">
                    <div class="platform"></div>
                    <div id="sparkle-layer" class="sparkle-container"></div>
                    <div id="boss-sprite-container" class="animate-float"></div>
                </div>

                <div class="ui-panel max-w-[200px] -mt-6 z-20">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-[10px] font-bold text-blue-200" id="boss-name">...</span>
                        <span class="text-[9px] text-slate-400" id="boss-hp-text">0/0</span>
                    </div>
                    <div class="health-bar">
                        <div id="boss-hp-fill" class="health-fill bg-gradient-to-r from-red-500 to-rose-400" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- 右側：玩家與控制區 -->
            <div class="flex flex-col space-y-4 h-full justify-center">
                <div class="ui-panel">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-[9px] font-black text-indigo-300">PLAYER HP</span>
                        <span class="text-[9px] text-white" id="player-hp-text">100/100</span>
                    </div>
                    <div class="health-bar h-2">
                        <div id="player-hp-fill" class="health-fill bg-gradient-to-r from-indigo-400 to-cyan-400" style="width: 100%"></div>
                    </div>
                    <div class="flex mt-2 space-x-2" id="attempts-container"></div>
                </div>

                <div class="ui-panel">
                    <div class="controls-row">
                        <button onclick="game.playWord()" class="btn-anime w-12 h-12 shrink-0 rounded-lg flex items-center justify-center">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="white" viewBox="0 0 24 24"><path d="M11 5 6 9 2 9 2 15 6 15 11 19 11 5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
                        </button>
                        <input type="text" id="word-input" spellcheck="false" autocomplete="off" class="input-box flex-grow px-3 text-white text-lg" placeholder="聽寫輸入..." onkeydown="if(event.key === 'Enter') game.checkSpelling()">
                        <button onclick="game.checkSpelling()" class="btn-anime h-12 px-6 shrink-0 rounded-lg font-bold text-white uppercase text-sm tracking-wider">攻擊</button>
                    </div>
                    <div id="feedback-msg" class="h-4 mt-2 text-xs font-bold text-center"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="screen-win" class="hidden flex-grow flex flex-col items-center justify-center text-center space-y-6">
        <div class="text-8xl animate-bounce">🏆</div>
        <h1 class="text-5xl header-font text-yellow-400">大勝利！</h1>
        <button onclick="location.reload()" class="btn-anime px-10 py-4 rounded-xl font-bold text-white">再玩一次</button>
    </div>
</div>

<script>
    const apiKey = ""; 

    // 音效合成器
    const AudioEngine = {
        ctx: new (window.AudioContext || window.webkitAudioContext)(),
        
        playTone(freq, type, duration, volume = 0.1, ramp = true) {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            gain.gain.setValueAtTime(volume, this.ctx.currentTime);
            if(ramp) {
                gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
            }
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + duration);
        },

        playBell() {
            this.playTone(880, 'sine', 0.5, 0.2);
            setTimeout(() => this.playTone(1108, 'sine', 0.6, 0.15), 100);
            setTimeout(() => this.playTone(1318, 'sine', 0.7, 0.1), 200);
        },

        playHit() {
            this.playTone(100, 'square', 0.2, 0.3);
            this.playTone(400, 'sawtooth', 0.1, 0.2);
        },

        playError() {
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.exponentialRampToValueAtTime(80, now + 1.2);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0, now + 1.2);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(); osc.stop(now + 1.2);
        },

        playHurt() {
            this.playTone(60, 'sine', 0.5, 0.4);
        }
    };

    const MONSTERS = [
        { 
            name: "閃電鼠 Sparky Mouse", 
            words: ["shoes", "robot", "ant", "We are in the park.", "I can see a bird."], 
            html: `<div class="emoji-sprite fx-electric" id="boss-main-sprite">🐭</div>`
        },
        { 
            name: "烈焰龍 Fire Dino", 
            words: ["褲子", "洗臉", "動物", "弟弟會自己刷牙", "我認識了很多新朋友。"], 
            html: `<div class="emoji-sprite fx-fire" id="boss-main-sprite">🦖</div>`
        },
        { 
            name: "晶瑩魚 Crystal Fin", 
            words: ["ocean", "shell", "swim", "blue", "The water is blue."], 
            html: `<div class="emoji-sprite fx-aqua" id="boss-main-sprite">🐬</div>`
        }
    ];

    class Game {
        constructor() {
            this.currentBossIndex = 0;
            this.defeatedCount = 0;
            this.defeatedBosses = new Array(MONSTERS.length).fill(false);
            this.player = { hp: 100, maxHp: 100 };
            this.battle = { active: false, word: "", currentWordPool: [], solvedCount: 0, totalWords: 0, attempts: 3 };
        }

        start() { 
            if (AudioEngine.ctx.state === 'suspended') AudioEngine.ctx.resume();
            this.switchScreen('screen-map'); 
            this.renderMap(); 
        }

        switchScreen(id) {
            document.querySelectorAll('#app > div').forEach(div => div.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        renderMap() {
            const grid = document.getElementById('map-grid');
            grid.innerHTML = '';
            MONSTERS.forEach((m, i) => {
                const locked = i > 0 && !this.defeatedBosses[i-1];
                const done = this.defeatedBosses[i];
                const card = document.createElement('div');
                card.className = `ui-panel flex flex-col items-center justify-center cursor-pointer transition-all ${locked ? 'opacity-30 grayscale pointer-events-none' : 'hover:scale-105 active:scale-95'}`;
                if (done) card.classList.add('border-green-500/50');
                
                card.innerHTML = `
                    <div class="text-4xl mb-2">${locked ? '🔒' : m.html}</div>
                    <div class="text-[10px] header-font text-blue-300 uppercase font-bold">${locked ? 'Locked' : m.name}</div>
                `;
                if (!locked && !done) card.onclick = () => this.initBattle(i);
                grid.appendChild(card);
            });
            document.getElementById('win-count').innerText = this.defeatedCount;
            if (this.defeatedCount === MONSTERS.length) this.switchScreen('screen-win');
        }

        initBattle(index) {
            this.currentBossIndex = index;
            const b = MONSTERS[index];
            this.battle.active = true;
            this.battle.currentWordPool = [...b.words]; 
            this.battle.totalWords = b.words.length;
            this.battle.solvedCount = 0;
            this.player.hp = this.player.maxHp;

            document.getElementById('boss-name').innerText = b.name;
            document.getElementById('battle-level').innerText = `STAGE ${index + 1}`;
            document.getElementById('boss-sprite-container').innerHTML = b.html;
            
            this.nextWord();
            this.updateUI();
            this.switchScreen('screen-battle');
            document.getElementById('word-input').value = "";
            document.getElementById('feedback-msg').innerText = "";
            setTimeout(() => document.getElementById('word-input').focus(), 500);
        }

        nextWord() {
            if (this.battle.currentWordPool.length === 0) { this.victory(); return; }
            this.battle.word = this.battle.currentWordPool[0];
            this.battle.attempts = 3;
            this.renderHearts();
            setTimeout(() => this.playWord(), 500);
        }

        renderHearts() {
            const container = document.getElementById('attempts-container');
            container.innerHTML = '';
            for(let i=0; i<3; i++) {
                const h = document.createElement('span');
                h.className = `text-sm ${i < this.battle.attempts ? 'text-rose-500' : 'text-slate-700'}`;
                h.innerText = '❤';
                container.appendChild(h);
            }
        }

        async playWord() {
            const text = this.battle.word;
            try {
                const voice = /[\u4e00-\u9fa5]/.test(text) ? "Kore" : "Puck"; 
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text }] }],
                        generationConfig: { 
                            responseModalities: ["AUDIO"], 
                            speechConfig: { 
                                voiceConfig: { 
                                    prebuiltVoiceConfig: { voiceName: voice } 
                                } 
                            } 
                        },
                        model: "gemini-2.5-flash-preview-tts"
                    })
                });
                const result = await response.json();
                const pcmData = result.candidates[0].content.parts[0].inlineData.data;
                const mimeType = result.candidates[0].content.parts[0].inlineData.mimeType;
                // 提取採樣率
                const sampleRateMatch = mimeType.match(/rate=(\d+)/);
                const sampleRate = sampleRateMatch ? parseInt(sampleRateMatch[1]) : 24000;
                
                await this.playAudio(pcmData, sampleRate);
            } catch (err) {
                const msg = new SpeechSynthesisUtterance(text);
                msg.lang = /[\u4e00-\u9fa5]/.test(text) ? 'zh-HK' : 'en-US';
                window.speechSynthesis.speak(msg);
            }
        }

        async playAudio(base64Data, sampleRate) {
            return new Promise((resolve, reject) => {
                try {
                    const binaryString = window.atob(base64Data);
                    const bytes = new Uint8Array(binaryString.length);
                    for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
                    
                    // 修正 WAV 標頭以符合 PCM16 格式
                    const wavHeader = new ArrayBuffer(44);
                    const view = new DataView(wavHeader);
                    view.setUint32(0, 0x52494646, false); // "RIFF"
                    view.setUint32(4, 36 + bytes.length, true); // 檔案大小
                    view.setUint32(8, 0x57415645, false); // "WAVE"
                    view.setUint32(12, 0x666d7420, false); // "fmt "
                    view.setUint32(16, 16, true); // fmt 長度
                    view.setUint16(20, 1, true); // PCM 格式
                    view.setUint16(22, 1, true); // 單聲道
                    view.setUint32(24, sampleRate, true); // 採樣率
                    view.setUint32(28, sampleRate * 2, true); // 位元率 (sampleRate * channels * bytesPerSample)
                    view.setUint16(32, 2, true); // 區塊對齊 (channels * bytesPerSample)
                    view.setUint16(34, 16, true); // 每採樣位元數
                    view.setUint32(36, 0x64617461, false); // "data"
                    view.setUint32(40, bytes.length, true); // 數據長度

                    const blob = new Blob([wavHeader, bytes], { type: 'audio/wav' });
                    const url = URL.createObjectURL(blob);
                    const audio = new Audio();
                    audio.src = url;
                    
                    audio.onended = () => {
                        URL.revokeObjectURL(url);
                        resolve();
                    };
                    audio.onerror = (e) => {
                        console.error("音訊播放錯誤", e);
                        URL.revokeObjectURL(url);
                        reject(e);
                    };
                    
                    audio.play().catch(reject);
                } catch (e) {
                    reject(e);
                }
            });
        }

        createHeavySparkles() {
            const container = document.getElementById('sparkle-layer');
            container.innerHTML = '';
            for (let i = 0; i < 40; i++) {
                const s = document.createElement('div');
                s.className = 'spark';
                const size = 3 + Math.random() * 12;
                const tx = (Math.random() - 0.5) * 300;
                const ty = (Math.random() - 0.5) * 300;
                s.style.width = size + 'px';
                s.style.height = size + 'px';
                s.style.setProperty('--tx', tx + 'px');
                s.style.setProperty('--ty', ty + 'px');
                s.style.animation = `spark-anim ${0.3 + Math.random() * 0.5}s cubic-bezier(0, .5, .5, 1) forwards`;
                container.appendChild(s);
            }
            const flash = document.getElementById('flash-overlay');
            flash.classList.remove('flash-white');
            void flash.offsetWidth; 
            flash.classList.add('flash-white');
        }

        checkSpelling() {
            const input = document.getElementById('word-input').value.trim();
            const target = this.battle.word.trim();
            const feedback = document.getElementById('feedback-msg');
            const spriteContainer = document.getElementById('boss-sprite-container');
            const mainSprite = document.getElementById('boss-main-sprite');

            if (input.toLowerCase() === target.toLowerCase()) {
                this.battle.solvedCount++;
                this.battle.currentWordPool.shift();
                
                AudioEngine.playBell();
                AudioEngine.playHit();
                
                feedback.innerText = "完美擊破！！ 💥";
                feedback.className = "text-yellow-400 text-sm italic font-black";
                
                this.createHeavySparkles();
                spriteContainer.classList.add('shake-heavy');
                mainSprite.classList.add('hit-effect');
                
                setTimeout(() => {
                    spriteContainer.classList.remove('shake-heavy');
                    mainSprite.classList.remove('hit-effect');
                }, 400);
                
                document.getElementById('word-input').value = "";
                this.nextWord();
            } else {
                this.battle.attempts--;
                this.renderHearts();
                
                if (this.battle.attempts > 0) {
                    AudioEngine.playError();
                    feedback.innerText = "失誤！注意聽清楚...";
                    feedback.className = "text-orange-400 text-xs";
                } else {
                    AudioEngine.playHurt();
                    const current = this.battle.currentWordPool.shift();
                    this.battle.currentWordPool.push(current);
                    const dmg = 15 + Math.min(25, target.length);
                    this.player.hp -= dmg;
                    
                    feedback.innerText = "遭到反擊！跳過此題...";
                    feedback.className = "text-red-500 text-xs";
                    
                    document.getElementById('screen-battle').classList.add('shake-heavy');
                    setTimeout(() => document.getElementById('screen-battle').classList.remove('shake-heavy'), 400);
                    
                    if (this.player.hp <= 0) this.defeat();
                    else { document.getElementById('word-input').value = ""; this.nextWord(); }
                }
            }
            this.updateUI();
        }

        updateUI() {
            const bPct = (this.battle.solvedCount / this.battle.totalWords) * 100;
            const pPct = (this.player.hp / this.player.maxHp) * 100;
            document.getElementById('boss-hp-fill').style.width = bPct + '%';
            document.getElementById('player-hp-fill').style.width = pPct + '%';
            document.getElementById('boss-hp-text').innerText = `${this.battle.solvedCount}/${this.battle.totalWords}`;
            document.getElementById('player-hp-text').innerText = `${Math.ceil(this.player.hp)}/100`;
        }

        victory() {
            this.defeatedBosses[this.currentBossIndex] = true;
            this.defeatedCount++;
            this.switchScreen('screen-map');
            this.renderMap();
        }

        defeat() { this.switchScreen('screen-map'); this.renderMap(); }

        goToMap() { this.switchScreen('screen-map'); this.renderMap(); }
    }

    const game = new Game();
</script>

</body>
</html>

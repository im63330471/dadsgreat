<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QR Code</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
      touch-action: manipulation;
    }
    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
    }
    .qr-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 0;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 20px;
      overflow: hidden;
    }
    #qrcode {
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 100%;
      max-height: 70%;
    }
    #qrcode canvas,
    #qrcode img,
    #qrcode table {
      max-width: 100%;
      max-height: 100%;
      width: auto !important;
      height: auto !important;
      border-radius: 8px;
    }
    .label {
      margin-top: 16px;
      font-size: 15px;
      color: #333;
      text-align: center;
      word-break: break-all;
      max-width: 100%;
      line-height: 1.4;
      flex-shrink: 0;
      max-height: 4.5em;
      overflow: hidden;
    }
    .placeholder {
      color: #999;
      font-size: 15px;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="qr-area">
      <div id="qrcode">
        <div class="placeholder">Add ?q=your-text to the URL</div>
      </div>
      <div class="label" id="label"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    (function () {
      const qrContainer = document.getElementById('qrcode');
      const label = document.getElementById('label');

      const params = new URLSearchParams(window.location.search);
      const text = (params.get('q') || params.get('text') || '').trim();

      if (!text) {
        qrContainer.innerHTML = '<div class="placeholder">Add ?q=your-text to the URL</div>';
        return;
      }

      // Clear placeholder
      qrContainer.innerHTML = '';

      // Calculate size based on available space
      const available = Math.min(
        Math.floor(qrContainer.parentElement.clientWidth - 40),
        Math.floor(qrContainer.parentElement.clientHeight * 0.65)
      );
      const size = Math.max(120, Math.min(available, 320));

      try {
        new QRCode(qrContainer, {
          text: text,
          width: size,
          height: size,
          colorDark: '#000000',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.M
        });
        label.textContent = text;
      } catch (err) {
        qrContainer.innerHTML = '<div class="placeholder">Error generating QR</div>';
        console.error(err);
      }

      // Prevent double-tap zoom on iOS
      let lastTouchEnd = 0;
      document.addEventListener('touchend', function (e) {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
          e.preventDefault();
        }
        lastTouchEnd = now;
      }, { passive: false });
    })();
  </script>
</body>
</html>

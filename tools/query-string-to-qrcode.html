<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QR Code Generator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
      touch-action: manipulation;
    }
    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 12px;
      gap: 12px;
    }
    .input-row {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    input[type="text"] {
      flex: 1;
      font-size: 16px; /* prevents iOS zoom on focus */
      padding: 12px 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      outline: none;
      background: #fff;
    }
    input[type="text"]:focus {
      border-color: #007aff;
    }
    button {
      font-size: 16px;
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: #007aff;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    button:active {
      background: #0056b3;
    }
    .qr-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 0;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 16px;
      overflow: hidden;
    }
    #qrcode {
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 100%;
      max-height: 70%;
    }
    #qrcode canvas,
    #qrcode img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      border-radius: 8px;
    }
    .label {
      margin-top: 12px;
      font-size: 14px;
      color: #333;
      text-align: center;
      word-break: break-all;
      max-width: 100%;
      line-height: 1.4;
      flex-shrink: 0;
      max-height: 4.2em;
      overflow: hidden;
    }
    .placeholder {
      color: #999;
      font-size: 15px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="input-row">
      <input type="text" id="textInput" placeholder="Enter text or URLâ€¦" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button id="generateBtn" type="button">Generate</button>
    </div>
    <div class="qr-area">
      <div id="qrcode">
        <div class="placeholder">QR code will appear here</div>
      </div>
      <div class="label" id="label"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
  <script>
    (function () {
      const input = document.getElementById('textInput');
      const btn = document.getElementById('generateBtn');
      const qrContainer = document.getElementById('qrcode');
      const label = document.getElementById('label');

      function generate() {
        const text = input.value.trim();
        qrContainer.innerHTML = '';
        label.textContent = '';

        if (!text) {
          qrContainer.innerHTML = '<div class="placeholder">QR code will appear here</div>';
          return;
        }

        // Size based on available space
        const size = Math.min(
          Math.floor(qrContainer.parentElement.clientWidth - 32),
          Math.floor(qrContainer.parentElement.clientHeight * 0.65)
        );

        QRCode.toCanvas(text, {
          width: size,
          margin: 2,
          color: {
            dark: '#000000',
            light: '#ffffff'
          },
          errorCorrectionLevel: 'M'
        }, function (err, canvas) {
          if (err) {
            qrContainer.innerHTML = '<div class="placeholder">Error generating QR</div>';
            console.error(err);
            return;
          }
          qrContainer.appendChild(canvas);
          label.textContent = text;
        });
      }

      btn.addEventListener('click', generate);
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          generate();
        }
      });

      // Prevent double-tap zoom on iOS
      let lastTouchEnd = 0;
      document.addEventListener('touchend', function (e) {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
          e.preventDefault();
        }
        lastTouchEnd = now;
      }, { passive: false });

      // Optional: generate on load if there's a query param
      const params = new URLSearchParams(window.location.search);
      const q = params.get('q') || params.get('text') || '';
      if (q) {
        input.value = q;
        generate();
      }
    })();
  </script>
</body>
</html>

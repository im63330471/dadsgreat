<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Centered Rotating Egg</title>
  <style>
    body { background: #222; }
    canvas { display: block; margin: 50px auto; background: #fff; }
  </style>
</head>
<body>
<canvas id="eggCanvas" width="300" height="400"></canvas>
<script>
  const canvas = document.getElementById("eggCanvas");
  const ctx = canvas.getContext("2d");

  const eggWidth = 200;   // width
  const eggHeight = 255;  // height
  const canvasWidth = canvas.width;
  const canvasHeight = canvas.height;

  // Egg center position (canvas center)
  const eggCenterX = canvasWidth / 2;
  const eggCenterY = canvasHeight / 2;

  // Rotation center relative to egg bounding box
  const rotationOffsetX = eggWidth / 2; // 10 left + 10 right means centered horizontally
  const rotationOffsetY = 13.5;         // 13.5 from top
  // Adjust so it's also 12 from bottom: eggHeight - 12 = 243, average with 13.5 gives ~128.25
  const rotationCenterY = eggHeight / 2; // balanced vertically

  let angle = 0;

  function drawEgg() {
    ctx.beginPath();
    ctx.ellipse(0, 0, eggWidth/2, eggHeight/2, 0, 0, 2 * Math.PI);
    ctx.fillStyle = "#f5deb3";
    ctx.fill();
    ctx.strokeStyle = "#8b7765";
    ctx.stroke();
  }

  function animate() {
    ctx.clearRect(0, 0, canvasWidth, canvasHeight);

    ctx.save();
    // Move to egg center
    ctx.translate(eggCenterX, eggCenterY);

    // Apply rotation around custom offset
    ctx.translate(rotationOffsetX - eggWidth/2, rotationOffsetY - eggHeight/2);
    ctx.rotate(angle);
    ctx.translate(-(rotationOffsetX - eggWidth/2), -(rotationOffsetY - eggHeight/2));

    // Draw egg centered
    drawEgg();

    ctx.restore();

    angle += 0.01; // rotation speed
    requestAnimationFrame(animate);
  }

  animate();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rotating Egg</title>
  <style>
    body { background: #222; }
    canvas { display: block; margin: 50px auto; background: #fff; }
  </style>
</head>
<body>
<canvas id="eggCanvas" width="300" height="400"></canvas>
<script>
  const canvas = document.getElementById("eggCanvas");
  const ctx = canvas.getContext("2d");

  const eggWidth = 200;   // width
  const eggHeight = 255;  // height
  const canvasWidth = canvas.width;
  const canvasHeight = canvas.height;

  // Rotation center (custom offsets)
  const rotationCenterX = 10 + eggWidth / 2;   // 10 from left/right
  const rotationCenterY = 13.5 + (eggHeight - 12 - 13.5) / 2; 
  // 13.5 from top, 12 from bottom

  let angle = 0;

  function drawEgg() {
    ctx.beginPath();
    // Egg shape using ellipse
    ctx.ellipse(0, 0, eggWidth/2, eggHeight/2, 0, 0, 2 * Math.PI);
    ctx.fillStyle = "#f5deb3";
    ctx.fill();
    ctx.strokeStyle = "#8b7765";
    ctx.stroke();
  }

  function animate() {
    ctx.clearRect(0, 0, canvasWidth, canvasHeight);

    ctx.save();
    // Move to rotation center
    ctx.translate(rotationCenterX, rotationCenterY);
    ctx.rotate(angle);

    // Draw egg centered at rotation point
    drawEgg();

    ctx.restore();

    angle += 0.1; // rotation speed
    requestAnimationFrame(animate);
  }

  animate();
</script>
</body>
</html>
